# 配置文件示例
# 复制此文件为 config.yaml 并修改为你的实际配置

# PostgreSQL配置
postgresql:
  host: localhost
  port: 5432
  db: crawler
  username: postgres
  password: postgres
  logLevel: info
  sslmode: disable
  timezone: Asia/Shanghai
  maxIdle: 10
  maxOpen: 50

# Redis配置（可选）
redis:
  address: localhost:6379
  password: ""
  db: 0

# 爬虫配置
crawler:
  workerCount: 10      # 并发工作线程数
  requestTimeout: 30    # 请求超时时间（秒）
  rateLimit: 200       # 请求间隔（毫秒）
  userAgent: "Go-Crawler/1.0"